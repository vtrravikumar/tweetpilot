name: TweetPilot Extension

on:
  push:
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/extension.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Package Vichar extension
        run: cd dist && zip -r ../vichar-extension.zip .
      - name: Upload Vichar extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vichar-extension
          path: extension/vichar-extension.zip
          if-no-files-found: error
